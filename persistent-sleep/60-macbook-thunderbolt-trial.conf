# Persistent successor to the /run trial. The matching basename overrides it,
# so pre/post commands cannot run twice during the installation boot.
[Service]
RuntimeDirectory=macbook-suspend
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=yes
ExecStartPre=/usr/local/sbin/macbook-suspend pre
ExecStopPost=/usr/local/sbin/macbook-suspend post
